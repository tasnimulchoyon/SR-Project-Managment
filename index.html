<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Republic - Employee & Project Management Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        * {
            scrollbar-width: thin;
            scrollbar-color: #6366f1 transparent;
        }
        *::-webkit-scrollbar { width: 9px; height: 9px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6366f1, #a855f7);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 999px;
        }
        *::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #818cf8, #c084fc);
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        *::-webkit-scrollbar-corner { background: transparent; }
        @media (min-width: 1024px) {
            body { overflow: hidden; }
            #app { height: 100vh; min-height: 0; overflow: hidden; }
            #app > main { min-height: 0; overflow-y: auto; }
            #app > main.dashboard-viewport-fit { overflow: hidden; }
            #app > main.dashboard-viewport-fit > div {
                height: 100%; min-height: 0; display: flex; flex-direction: column;
            }
            #app > main.dashboard-viewport-fit > div > .grid:first-child { flex: none; }
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) { flex: 1; min-height: 0; }
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) > div {
                height: auto !important; min-height: 0;
            }
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) > div:first-child > div:last-child {
                flex: 1; min-height: 0; overflow-y: auto;
            }
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) > div:nth-child(2) > .department-dashboard-content {
                flex: 1; min-height: 0; overflow-y: auto;
            }
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) > div:nth-child(2) > .admin-department-panel-content {
                flex: 1; min-height: 0; overflow: hidden;
            }
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) > div:nth-child(2) > .admin-department-panel-content > .admin-department-scroll {
                flex: 1; min-height: 0; overflow-y: auto;
            }
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) > div:first-child > div:last-child > div {
                height: 72px !important; min-height: 72px;
            }
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) > div:nth-child(2) > .department-dashboard-content > .department-progress-row,
            #app > main.dashboard-viewport-fit > div > .grid:nth-child(2) > div:nth-child(2) > .admin-department-panel-content > .admin-department-scroll > .department-progress-row {
                height: 84px !important; min-height: 84px;
            }
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

    <div id="app" class="min-h-full flex flex-col"></div>

    <script>
        // Initial Mock Data
        const DEFAULT_DEPARTMENTS = ['Software Development', 'Template Design', 'Website Development', 'HR'];
        let DEPARTMENTS = JSON.parse(localStorage.getItem('sr_departments')) || DEFAULT_DEPARTMENTS;

        const DEFAULT_EMPLOYEES = [
            { id: '1', name: 'Super Admin', email: 'admin@storerepublic.com', password: '123', role: 'Super Admin', dept: 'Management' },
            { id: '2', name: 'Rahim Ahmed', email: 'rahim@storerepublic.com', password: '123', role: 'Employee', dept: 'Software Development' },
            { id: '3', name: 'Sadia Islam', email: 'sadia@storerepublic.com', password: '123', role: 'Employee', dept: 'Template Design' },
            { id: '4', name: 'Tanvir Hossain', email: 'tanvir@storerepublic.com', password: '123', role: 'Employee', dept: 'Website Development' },
            { id: '5', name: 'Nusrat Jahan', email: 'nusrat@storerepublic.com', password: '123', role: 'Employee', dept: 'HR' }
        ];

        
        const DEFAULT_NOTIFICATIONS = [
            {
                id: 'n1',
                recipient: 'Sadia Islam',
                projectId: 'p2',
                projectName: 'Corporate Dashboard UI Kit',
                title: 'New Project Assigned!',
                message: 'Super Admin assigned a new project to you.',
                timestamp: 'Just now',
                read: false
            },
            {
                id: 'n2',
                recipient: 'Rahim Ahmed',
                projectId: 'p1',
                projectName: 'E-Commerce Platform Redesign',
                title: 'New Project Assigned!',
                message: 'Super Admin assigned a new project to you.',
                timestamp: '1 hour ago',
                read: false
            }
        ];

        const DEFAULT_PROJECTS = [
            {
                id: 'p1',
                name: 'E-Commerce Platform Redesign',
                clientName: 'Global Traders Ltd',
                clientPhone: '+8801711223344',
                clientEmail: 'contact@globaltraders.com',
                dept: 'Software Development',
                startDate: '2026-11-01',
                estimateDate: '2026-11-18',
                priority: 'Urgent',
                status: 'To Do / In Progress',
                assignedTo: 'Rahim Ahmed',
                progress: 60,
                liveLink: 'https://storerepublic.com/demo-ecommerce',
                todos: [
                    { 
                        id: 't1', 
                        text: 'Database schema setup', 
                        completed: true,
                        subtasks: [
                            { id: 'st1', text: 'Users & Roles table', completed: true },
                            { id: 'st2', text: 'Products & Orders table', completed: true }
                        ]
                    },
                    {

                        text: 'Authentication & user roles', 
                        completed: true,
                        subtasks: [
                            { id: 'st3', text: 'JWT Login endpoint', completed: true }
                        ]
                    },
                    { 
                        id: 't3', 
                        text: 'Payment gateway sandbox test', 
                        completed: false,
                        subtasks: [
                            { id: 'st4', text: 'SSLCommerz integration', completed: false },
                            { id: 'st5', text: 'Webhook response handle', completed: false }
                        ]
                    }
                ],
                notes: 'Working on checkout gateway integration and payment security protocols.'
            }
        ];

        // Application State
        let state = {
            darkMode: localStorage.getItem('sr_dark') !== null ? localStorage.getItem('sr_dark') === 'true' : true,
            currentUser: JSON.parse(localStorage.getItem('sr_current_user')) || null,
            activeTab: 'dashboard',
            viewMode: 'list', 
            employees: JSON.parse(localStorage.getItem('sr_employees')) || DEFAULT_EMPLOYEES,
            projects: JSON.parse(localStorage.getItem('sr_projects')) || DEFAULT_PROJECTS,
            searchTerm: '',
            filterDept: 'All',
            filterStatus: 'All',
            filterAssignedEmployee: '',
            selectedEmployee: null,
            selectedProject: null,
            isProjectModalOpen: false,
            isEmployeeModalOpen: false,
            isEmployeeEditModalOpen: false,
            isPasswordModalOpen: false,
            isOfficeModalOpen: false,
            officeName: localStorage.getItem('sr_office_name') || 'Store Republic',
            officeTagline: localStorage.getItem('sr_office_tagline') || 'Employee & Project Management Hub',
            departments: JSON.parse(localStorage.getItem('sr_departments')) || DEFAULT_DEPARTMENTS,
            isClientModalOpen: false,
            isDocModalOpen: false,
            isProfileMenuOpen: false,
            isNotificationMenuOpen: false,
            notifications: JSON.parse(localStorage.getItem('sr_notifications')) || DEFAULT_NOTIFICATIONS,
            activeClientData: null,
            isClientEditing: false,
            activeDocData: null,
            tempTodos: [],
            activeSubtaskInput: null
        };

        function setState(newState) {
            state = { ...state, ...newState };
            localStorage.setItem('sr_dark', state.darkMode);
            localStorage.setItem('sr_current_user', JSON.stringify(state.currentUser));
            localStorage.setItem('sr_employees', JSON.stringify(state.employees));
            localStorage.setItem('sr_projects', JSON.stringify(state.projects));
            localStorage.setItem('sr_notifications', JSON.stringify(state.notifications || []));
            localStorage.setItem('sr_office_name', state.officeName || 'Store Republic');
            localStorage.setItem('sr_office_tagline', state.officeTagline || 'Employee & Project Management Hub');
            localStorage.setItem('sr_departments', JSON.stringify(state.departments || DEFAULT_DEPARTMENTS));
            DEPARTMENTS = state.departments || DEFAULT_DEPARTMENTS;
            render();
        }

        
        function getStatusIndicatorColor(status) {
            if (status === 'Completed') {
                return 'bg-emerald-500';
            } else if (status === 'Review') {
                return 'bg-amber-400';
            } else {
                // To Do / In Progress (Red)
                return 'bg-rose-500';
            }
        }

        function getStatusBorderColor(status) {
            if (status === 'Completed') {
                return 'border-l-4 border-l-emerald-500';
            } else if (status === 'Review') {
                return 'border-l-4 border-l-amber-400';
            } else {
                // To Do / In Progress (Red)
                return 'border-l-4 border-l-rose-500';
            }
        }

        function getStatusBadgeClass(status) {
            if (status === 'Completed') {
                return 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20';
            } else if (status === 'Review') {
                return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
            } else {
                // To Do / In Progress (Red)
                return 'bg-rose-500/10 text-rose-500 border border-rose-500/20';
            }
        }

        function calculateOverallProgress(todos) {
            if (!todos || todos.length === 0) return 0;
            let totalItems = 0;
            let completedItems = 0;

            todos.forEach(t => {
                totalItems++;
                if (t.completed) completedItems++;
                if (t.subtasks && t.subtasks.length > 0) {
                    t.subtasks.forEach(st => {
                        totalItems++;
                        if (st.completed) completedItems++;
                    });
                }
            });

            if (totalItems === 0) return 0;
            return Math.round((completedItems / totalItems) * 100);
        }

        function formatDate(dateValue) {
            if (!dateValue) return '';
            const dateOnlyMatch = String(dateValue).match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (dateOnlyMatch) return `${dateOnlyMatch[3]} - ${dateOnlyMatch[2]} - ${dateOnlyMatch[1]}`;
            const date = new Date(dateValue);
            if (Number.isNaN(date.getTime())) return String(dateValue);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day} - ${month} - ${year}`;
        }

        // --- RENDER ROUTER ---
        function render() {
            const app = document.getElementById('app');
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            if (!state.currentUser) {
                app.innerHTML = renderLoginScreen();
            } else {
                app.innerHTML = renderMainDashboard();
            }

            lucide.createIcons();
        }

        // --- LOGIN SCREEN ---
        function renderLoginScreen() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-950 transition-colors">
                    <div class="w-full max-w-md p-8 rounded-3xl border shadow-2xl bg-white/90 dark:bg-slate-900/90 border-slate-200 dark:border-slate-800 backdrop-blur-xl">
                        <div class="flex justify-between items-center mb-8">
                            <div class="flex items-center space-x-3">
                                <div class="bg-indigo-600 text-white p-3 rounded-2xl shadow-lg shadow-indigo-500/30">
                                    <i data-lucide="folder-kanban" class="w-7 h-7"></i>
                                </div>
                                <div>
                                    <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">
                                        Store Republic
                                    </h1>
                                    <p class="text-xs text-slate-400 font-medium">Employee Portal Login</p>
                                </div>
                            </div>
                            <button onclick="toggleTheme()" class="p-2.5 rounded-xl border bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-amber-400">
                                <i data-lucide="${state.darkMode ? 'sun' : 'moon'}" class="w-5 h-5"></i>
                            </button>
                        </div>

                        <div id="login-error" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/20 text-rose-500 rounded-xl text-xs font-semibold flex items-center space-x-2">
                            <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                            <span id="login-error-text"></span>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Work Email / ID</label>
                                <div class="flex items-center px-3.5 py-3 rounded-2xl border bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700">
                                    <i data-lucide="mail" class="w-4 h-4 text-slate-400 mr-3"></i>
                                    <input required type="email" id="login-email" placeholder="e.g. admin@storerepublic.com" class="bg-transparent text-sm focus:outline-none w-full">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                                <div class="flex items-center px-3.5 py-3 rounded-2xl border bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700">
                                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 mr-3"></i>
                                    <input required type="password" id="login-password" placeholder="••••••••" class="bg-transparent text-sm focus:outline-none w-full">
                                </div>
                            </div>

                                Sign In to Workspace
                            </button>
                        </form>

                        <div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800">

                                        <div>
                                            <span class="font-bold text-xs block">${emp.name}</span>
                                            <span class="text-[10px] text-slate-400">${emp.role} • ${emp.dept}</span>
                                        </div>

                                `).join('')}
                            </div>

                </div>
            `;
        }

        // --- MAIN DASHBOARD VIEW ---
        function renderMainDashboard() {
            const isSuperAdmin = state.currentUser.role === 'Super Admin';

            return `
                <header class="sticky top-0 z-40 border-b px-6 py-4 flex items-center justify-between shadow-sm backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-slate-200 dark:border-slate-800">
                    <div class="flex items-center space-x-3">
                        <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                            <i data-lucide="folder-kanban" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">
                                ${state.officeName || 'Store Republic'}
                            </h1>
                            <p class="text-xs text-slate-400 font-medium">${state.officeTagline || 'Employee & Project Management Hub'}</p>
                        </div>
                    </div>

                    <!-- Right Side Actions: Notification Bell + Profile -->
                    <div class="flex items-center space-x-3">
                        <!-- Notification Bell Button with Badge -->
                        ${(() => {
                            const currentUserName = state.currentUser ? state.currentUser.name : '';
                            const isSuperAdmin = state.currentUser && state.currentUser.role === 'Super Admin';
                            // Filter notifications: employee gets their assigned ones, super admin gets all
                            const userNotifs = (state.notifications || []).filter(n => {
        if (isSuperAdmin) {
            return n.recipient === 'Super Admin' || n.recipient === currentUserName;
        }
        return n.recipient === currentUserName;
    });
                            const unreadCount = userNotifs.filter(n => !n.read).length;

                            return `
                            <div class="relative">
                                <button id="notification-menu-trigger" onclick="toggleNotificationMenu(event)" class="relative p-2.5 rounded-2xl border bg-slate-100/80 dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:text-indigo-500 dark:hover:text-indigo-400 hover:border-indigo-400 dark:hover:border-indigo-500/50 transition-all cursor-pointer shadow-sm group" title="Notifications">
                                    <i data-lucide="bell" class="w-5 h-5 transition-transform group-hover:rotate-12"></i>
                                    ${unreadCount > 0 ? `
                                        <span class="absolute top-1.5 right-1.5 flex h-2.5 w-2.5">
                                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
                                        </span>
                                    ` : ''}
                                </button>

                                <!-- Notification Dropdown Menu -->
                                ${state.isNotificationMenuOpen ? `
                                    <div id="notification-dropdown-menu" class="absolute right-0 top-14 w-80 rounded-2xl border shadow-2xl bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 py-3 z-50 text-slate-800 dark:text-slate-100 animate-fadeIn divide-y divide-slate-100 dark:divide-slate-800/80">
                                        <div class="px-4 pb-2.5 flex items-center justify-between">
                                            <div class="flex items-center space-x-2">
                                                <i data-lucide="bell" class="w-4 h-4 text-indigo-500"></i>
                                                <span class="text-xs font-bold uppercase tracking-wider">Notifications</span>
                                            </div>
                                            ${unreadCount > 0 ? `
                                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-500">${unreadCount} New</span>
                                            ` : '<span class="text-[10px] font-semibold text-slate-400">All Read</span>'}
                                        </div>

                                        <div class="py-2 max-h-72 overflow-y-auto space-y-1 px-2">
                                            ${userNotifs.length === 0 ? `
                                                <div class="py-6 text-center text-slate-400">
                                                    <i data-lucide="bell-off" class="w-6 h-6 mx-auto mb-1 opacity-50"></i>
                                                    <p class="text-xs">No notifications yet</p>
                                                </div>
                                            ` : userNotifs.map(n => `
                                                <div onclick="handleNotificationClick('${n.id}', '${n.projectId}')" class="p-2.5 rounded-xl transition-colors cursor-pointer flex space-x-3 items-start ${n.read ? 'hover:bg-slate-50 dark:hover:bg-slate-800/50 opacity-75' : 'bg-indigo-500/5 hover:bg-indigo-500/10 border border-indigo-500/20'}">
                                                    <div class="w-2 h-2 rounded-full ${n.read ? 'bg-slate-300 dark:bg-slate-600' : 'bg-indigo-500'} mt-1.5 flex-shrink-0"></div>
                                                    <div class="flex-1 min-w-0">
                                                        <div class="flex items-center justify-between gap-1">
                                                            <p class="text-xs font-bold truncate ${n.read ? 'text-slate-700 dark:text-slate-300' : 'text-indigo-500 dark:text-indigo-400'}">${n.title}</p>
                                                            <span class="text-[9px] text-slate-400 flex-shrink-0">${n.timestamp}</span>
                                                        </div>
                                                        <p class="text-[11px] text-slate-600 dark:text-slate-300 mt-0.5 line-clamp-2">${n.message}</p>
                                                        <span class="text-[10px] text-indigo-400 font-semibold inline-flex items-center space-x-1 mt-1 hover:underline">
                                                            <span>View Project</span>
                                                            <i data-lucide="arrow-right" class="w-3 h-3"></i>
                                                        </span>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>

                                        ${unreadCount > 0 ? `
                                            <div class="pt-2 px-4 text-center">
                                                <button onclick="markAllNotificationsRead()" class="text-[11px] font-bold text-indigo-500 hover:underline">Mark all as read</button>
                                            </div>
                                        ` : ''}
                                    </div>
                                ` : ''}
                            </div>
                            `;
                        })()}

                        <!-- Profile Icon with Dropdown Menu -->
                        <div class="relative">
                            <!-- Profile Trigger Button -->
                            <button id="profile-menu-trigger" onclick="toggleProfileMenu(event)" class="flex items-center space-x-3 p-1.5 pr-3 rounded-2xl border bg-slate-100/80 dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 hover:border-indigo-500/60 dark:hover:border-indigo-500/60 transition-all cursor-pointer shadow-sm group">
                                <div class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-purple-600 text-white rounded-xl flex items-center justify-center font-extrabold text-sm shadow-md shadow-indigo-500/25 group-hover:scale-105 transition-transform">

                                </div>
                                <div class="text-left hidden sm:block">
                                    <span class="font-bold text-xs block text-slate-800 dark:text-slate-100 leading-tight">${state.currentUser.name}</span>
                                    <span class="text-[10px] text-indigo-400 font-semibold">${state.currentUser.role}</span>
                                </div>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200 ${state.isProfileMenuOpen ? 'rotate-180 text-indigo-400' : ''}"></i>
                            </button>

                            <!-- Profile Dropdown Menu -->
                            ${state.isProfileMenuOpen ? `
                                <div id="profile-dropdown-menu" class="absolute right-0 top-14 w-64 rounded-2xl border shadow-2xl bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 py-2 z-50 text-slate-800 dark:text-slate-100 animate-fadeIn divide-y divide-slate-100 dark:divide-slate-800/80">
                                    <!-- User info header in dropdown -->
                                    <div class="px-4 py-3">
                                        <p class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate">${state.currentUser.name}</p>
                                        <p class="text-[11px] text-slate-400 truncate mt-0.5">${state.currentUser.email || ''}</p>
                                        <div class="mt-2 flex items-center space-x-1.5">
                                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-500/10 text-indigo-400">${state.currentUser.role}</span>
                                            <span class="text-[10px] text-slate-400">• ${state.currentUser.dept || 'Staff'}</span>
                                        </div>
                                    </div>

                                    <!-- Actions -->

        function renderProjectDetailsPage() {

            const isSuperAdmin = state.currentUser.role === 'Super Admin';
            const todos = p.todos || [];
            
            // Calculate stats
            let totalTasks = 0;
            let doneTasks = 0;
            todos.forEach(t => {
                totalTasks++;
                if (t.completed) doneTasks++;
                (t.subtasks || []).forEach(st => {
                    totalTasks++;
                    if (st.completed) doneTasks++;
                });
            });
            const dueTasks = totalTasks - doneTasks;
            const progress = totalTasks === 0 ? p.progress : Math.round((doneTasks / totalTasks) * 100);

            // Separate into Done & Due main todos
            const completedTodos = todos.filter(t => t.completed && (!t.subtasks || t.subtasks.every(st => st.completed)));
            const dueTodos = todos.filter(t => !t.completed || (t.subtasks && t.subtasks.some(st => !st.completed)));

            // Days left calculation
            const today = new Date();
            today.setHours(0,0,0,0);

                        <!-- Timeline & Links -->

                                    <i data-lucide="calendar" class="w-4 h-4"></i>
                                    <span>Project Schedule</span>
                                </h3>
                                <div class="space-y-4">

                                                <i data-lucide="calendar-check" class="w-3.5 h-3.5 text-indigo-400 flex-shrink-0"></i>
                                                <span>${formatDate(p.startDate)}</span>

                                                <span>${formatDate(p.estimateDate)}</span>
                                            </span>

                                    <span>Add</span>
                                </button>
                            </form>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <!-- Due / Pending Work Column -->
                            <div class="p-5 rounded-2xl border bg-amber-500/5 border-amber-500/20 space-y-4">
                                <div class="flex items-center justify-between">
                                    <h4 class="text-xs font-bold uppercase tracking-wider text-amber-500 flex items-center space-x-1.5">
                                        <i data-lucide="clock" class="w-4 h-4"></i>
                                        <span>Due / Pending Work (${dueTodos.length})</span>
                                    </h4>
                                    <span class="text-[11px] font-bold text-amber-500 bg-amber-500/10 px-2.5 py-0.5 rounded-full">Incomplete</span>

                                        </div>
                                    ` : dueTodos.map(t => {
                                        const subtasks = t.subtasks || [];
                                        const doneSubs = subtasks.filter(s => s.completed).length;
                                        return `
                                            <div class="p-3.5 rounded-xl border bg-white dark:bg-slate-800 border-amber-500/30 shadow-sm space-y-2">
                                                <div class="flex items-center justify-between">
                                                    <label class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0">
                                                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleProjectDetailTodo('${t.id}')" class="w-4 h-4 rounded text-amber-500 cursor-pointer accent-amber-500">
                                                        <span class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate ${t.completed ? 'line-through text-slate-400' : ''}">${t.text}</span>
                                                    </label>
                                                    ${subtasks.length > 0 ? `
                                                        <span class="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-amber-500/10 text-amber-500">
                                                            ${doneSubs}/${subtasks.length} Subtasks Done
                                                        </span>
                                                    ` : ''}
                                                </div>

                                                ${subtasks.length > 0 ? `
                                                    <div class="pl-6 pt-1.5 space-y-1.5 border-t border-slate-100 dark:border-slate-700/50">
                                                        ${subtasks.map(st => `
                                                            <label class="flex items-center space-x-2 cursor-pointer text-[11px]">
                                                                <input type="checkbox" ${st.completed ? 'checked' : ''} onchange="toggleProjectDetailSubtask('${t.id}', '${st.id}')" class="w-3.5 h-3.5 rounded text-indigo-500 cursor-pointer accent-indigo-500">
                                                                <span class="${st.completed ? 'line-through text-slate-400' : 'text-slate-600 dark:text-slate-300 font-medium'}">${st.text}</span>
                                                            </label>
                                                        `).join('')}
                                                    </div>
                                                ` : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <!-- Completed Work Column -->
                            <div class="p-5 rounded-2xl border bg-emerald-500/5 border-emerald-500/20 space-y-4">
                                <div class="flex items-center justify-between">
                                    <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-500 flex items-center space-x-1.5">
                                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                                        <span>Completed Work (${completedTodos.length})</span>
                                    </h4>
                                    <span class="text-[11px] font-bold text-emerald-500 bg-emerald-500/10 px-2.5 py-0.5 rounded-full">Done</span>
                                </div>

                                <div class="space-y-3">
                                    ${completedTodos.length === 0 ? `
                                        <div class="text-center py-8">
                                            <i data-lucide="circle-dashed" class="w-8 h-8 text-slate-400 mx-auto mb-2 opacity-50"></i>
                                            <p class="text-xs font-semibold text-slate-400">No completed tasks yet.</p>
                                            <p class="text-[11px] text-slate-500 mt-0.5">Check off tasks as you finish them to see them here.</p>
                                        </div>
                                    ` : completedTodos.map(t => {

                                        return `
                                            <div class="p-3.5 rounded-xl border bg-white dark:bg-slate-800 border-emerald-500/30 shadow-sm space-y-2 opacity-90">
                                                <div class="flex items-center justify-between">
                                                    <label class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0">
                                                        <input type="checkbox" checked onchange="toggleProjectDetailTodo('${t.id}')" class="w-4 h-4 rounded text-emerald-500 cursor-pointer accent-emerald-500">
                                                        <span class="text-xs font-bold line-through text-slate-400 dark:text-slate-500 truncate">${t.text}</span>

                                                ${subtasks.length > 0 ? `
                                                    <div class="pl-6 pt-1.5 space-y-1.5 border-t border-slate-100 dark:border-slate-700/50">
                                                        ${subtasks.map(st => `
                                                            <div class="flex items-center space-x-2 text-[11px] text-slate-400">
                                                                <i data-lucide="check" class="w-3 h-3 text-emerald-500"></i>
                                                                <span class="line-through">${st.text}</span>
                                                            </div>
                                                        `).join('')}
                                                    </div>
                                                ` : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProjectsTab() {
            const isSuperAdmin = state.currentUser.role === 'Super Admin';
            
            let baseProjects = isSuperAdmin ? state.projects : state.projects.filter(p => p.assignedTo === state.currentUser.name);
            if (state.filterAssignedEmployee) {
                baseProjects = baseProjects.filter(p => p.assignedTo === state.filterAssignedEmployee);
            }

            let filteredProjects = baseProjects.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(state.searchTerm.toLowerCase()) || 
                                      p.clientName.toLowerCase().includes(state.searchTerm.toLowerCase());
                const matchesDept = state.filterDept === 'All' || p.dept === state.filterDept;
                const matchesStatus = state.filterStatus === 'All'
                    || (state.filterStatus === 'Active' ? p.status !== 'Completed' : p.status === state.filterStatus);
                return matchesSearch && matchesDept && matchesStatus;
            }).sort((a, b) => Number(a.status === 'Completed') - Number(b.status === 'Completed'));

            return `
                <div class="space-y-[15px]">
                    <div class="p-4 rounded-2xl border shadow-sm flex flex-wrap items-center justify-between gap-4 bg-white dark:bg-slate-800/60 border-slate-200 dark:border-slate-700/60">
                        <div class="flex flex-wrap items-center gap-3 flex-1">

                            </div>
                            <select onchange="updateFilterDept(this.value)" class="px-3 py-2 rounded-xl border text-sm bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700">

                                ${DEPARTMENTS.map(d => `<option value="${d}" ${state.filterDept === d ? 'selected' : ''}>${d}</option>`).join('')}
                            </select>
                            <select onchange="updateFilterStatus(this.value)" class="px-3 py-2 rounded-xl border text-sm bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700">
                                <option value="All" ${state.filterStatus === 'All' ? 'selected' : ''}>All Status</option>
                                <option value="Active" ${state.filterStatus === 'Active' ? 'selected' : ''}>Active Projects</option>
                                <option value="To Do / In Progress" ${state.filterStatus === 'To Do / In Progress' ? 'selected' : ''}>To Do / In Progress</option>
                                <option value="Review" ${state.filterStatus === 'Review' ? 'selected' : ''}>Review</option>
                                <option value="Completed" ${state.filterStatus === 'Completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </div>

                        <div class="flex items-center space-x-3">
                            <div class="flex rounded-xl border p-1 bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700">
                                <button onclick="setViewMode('list')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${state.viewMode === 'list' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'}">List</button>
                                <button onclick="setViewMode('kanban')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${state.viewMode === 'kanban' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'}">Kanban</button>
                            </div>
                            ${isSuperAdmin ? `
                                <button onclick="openNewProjectModal()" class="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-500/20">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                    <span>New Project</span>
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    ${filteredProjects.length === 0 ? `
                        <div class="p-12 text-center rounded-2xl border bg-white dark:bg-slate-800/40 border-slate-200 dark:border-slate-700">
                            <i data-lucide="folder-open" class="w-12 h-12 text-slate-400 mx-auto mb-3"></i>
                            <h3 class="font-bold text-base">No Assigned Projects Found</h3>
                            <p class="text-xs text-slate-400 mt-1">You currently do not have any projects matching this filter.</p>
                        </div>
                    ` : state.viewMode === 'list' ? `
                        <div class="rounded-2xl border overflow-hidden shadow-sm bg-white dark:bg-slate-800/40 border-slate-200 dark:border-slate-700/60">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b text-xs uppercase tracking-wider bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500">
                                        <th class="p-4">Project Name</th>
                                        <th class="p-4">Client</th>
                                        <th class="p-4">Department</th>
                                        ${isSuperAdmin ? '<th class="p-4">Assigned To</th>' : ''}
                                        <th class="p-4">Progress (To-Dos)</th>
                                        <th class="p-4">Deadline</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 dark:divide-slate-700/20 text-sm">
                                    ${filteredProjects.map(project => {
                                        return `
                                            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                                                <td class="p-4 relative pl-6">
        <!-- Floating vertical status line with top & bottom gap so adjacent rows never touch -->
        <div class="absolute left-1.5 top-3.5 bottom-3.5 w-1 rounded-full ${getStatusIndicatorColor(project.status)}"></div>
        <button onclick="openProjectDetails('${project.id}')" class="font-bold text-left hover:text-indigo-500 transition-colors flex items-center space-x-1.5 group">
            <span class="group-hover:underline">${project.name}</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-0 group-hover:opacity-100 transition-opacity text-indigo-400"></i>
        </button>
    </td>
                                                <td class="p-4 text-slate-400">${project.clientName}</td>
                                                <td class="p-4">${project.dept}</td>
                                                ${isSuperAdmin ? `<td class="p-4 font-medium text-indigo-400">${project.assignedTo}</td>` : ''}
                                                <td class="p-4">
                                                    <div class="flex items-center space-x-2">
                                                        <div class="w-24 bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                                                            <div class="bg-indigo-500 h-full rounded-full" style="width: ${project.progress}%"></div>
                                                        </div>
                                                        <span class="text-xs font-bold">${project.progress}%</span>
                                                    </div>
                                                </td>
                                                <td class="p-4 text-xs font-semibold text-rose-400">${formatDate(project.estimateDate)}</td>
                                                <td class="p-4"><span class="text-xs px-2.5 py-1 rounded-lg font-semibold inline-block ${getStatusBadgeClass(project.status)}">${project.status}</span></td>
                                                <td class="p-4 text-right">
                                                    <div class="flex items-center justify-end space-x-2">
                                                        <!-- Eye Icon for Live Link (Visible only if liveLink exists) -->
                                                        ${project.liveLink ? `
                                                            <a href="${project.liveLink}" target="_blank" class="p-2 rounded-lg bg-blue-500/10 text-blue-500 hover:bg-blue-500/20 transition-colors" title="Open Live Link">
                                                                <i data-lucide="eye" class="w-4 h-4"></i>
                                                            </a>
                                                        ` : ''}
                                                        <!-- User Icon for Client & Project Info -->
                                                        <button onclick="openClientModal('${project.id}')" class="p-2 rounded-lg bg-indigo-500/10 text-indigo-500 hover:bg-indigo-500/20 transition-colors" title="Client & Project Info">
                                                            <i data-lucide="user" class="w-4 h-4"></i>
                                                        </button>
                                                        <!-- Document Icon for To-Do, Subtasks & Notes -->
                                                        <button onclick="openDocModal('${project.id}')" class="p-2 rounded-lg bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500/20 transition-colors" title="To-Do, Subtasks & Notes">
                                                            <i data-lucide="file-text" class="w-4 h-4"></i>
                                                        </button>
                                                        ${isSuperAdmin ? `
                                                            <button onclick="deleteProject('${project.id}', '${project.name}')" class="p-2 rounded-lg bg-rose-500/10 text-rose-500 hover:bg-rose-500/20 transition-colors" title="Delete Project">
                                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                            </button>
                                                        ` : ''}
                                                    </div>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${['To Do / In Progress', 'Review', 'Completed'].map(statusCol => {
                                const colProjects = filteredProjects.filter(p => p.status === statusCol);
                                return `
                                    <div class="p-4 rounded-2xl border flex flex-col min-h-[500px] bg-white dark:bg-slate-800/40 border-slate-200 dark:border-slate-700/60">
                                        <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200 dark:border-slate-700/20">
                                            <h4 class="font-bold text-sm uppercase tracking-wider">${statusCol}</h4>
                                            <span class="text-xs bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded-full font-bold">${colProjects.length}</span>
                                        </div>
                                        <div class="space-y-4 flex-1">
                                            ${colProjects.map(project => {

        // --- OFFICE SETUP MODAL CONTROLLERS ---
        function openOfficeModal() {
            setState({ isOfficeModalOpen: true });

        function closeOfficeModal() {
            setState({ isOfficeModalOpen: false });
        }

        function saveOfficeSettings(e) {
            e.preventDefault();
            const form = e.target;
            const newName = form.officeName.value.trim() || 'Store Republic';
            const newTagline = form.officeTagline.value.trim() || 'Employee & Project Management Hub';

            document.title = newName + ' - ' + newTagline;
            setState({
                officeName: newName,
                officeTagline: newTagline,
                isOfficeModalOpen: false
            });
            alert('Office settings saved successfully!');
        }

        function addNewDepartment(e) {
            e.preventDefault();
            const input = document.getElementById('new-dept-name-input');
            if (!input || !input.value.trim()) return;
            const deptName = input.value.trim();

            const currentDepts = state.departments || DEFAULT_DEPARTMENTS;
            if (currentDepts.some(d => d.toLowerCase() === deptName.toLowerCase())) {
                alert('This department already exists!');
                return;
            }

            const updatedDepts = [...currentDepts, deptName];
            input.value = '';
            setState({ departments: updatedDepts });
        }

        function removeDepartment(deptName) {
            const currentDepts = state.departments || DEFAULT_DEPARTMENTS;
            if (currentDepts.length <= 1) {
                alert('At least one department must remain active.');
                return;
            }
            if (confirm(`Are you sure you want to remove the "${deptName}" department?`)) {
                const updatedDepts = currentDepts.filter(d => d !== deptName);
                setState({ departments: updatedDepts });
            }
        }

        function toggleProjectDetailTodo(todoId) {
            if (!state.selectedProject) return;
            const projId = state.selectedProject.id;
            const updatedProjects = state.projects.map(p => {
                if (p.id === projId) {
                    const todos = (p.todos || []).map(t => {
                        if (t.id === todoId) {
                            const nextCompleted = !t.completed;
                            const nextSubtasks = (t.subtasks || []).map(st => ({ ...st, completed: nextCompleted }));
                            return { ...t, completed: nextCompleted, subtasks: nextSubtasks };
                        }
                        return t;
                    });
                    const newProgress = calculateOverallProgress(todos);
                    return { ...p, todos, progress: newProgress };
                }
                return p;
            });
            const updatedSelected = updatedProjects.find(p => p.id === projId);
            setState({ projects: updatedProjects, selectedProject: updatedSelected });
        }

        function toggleProjectDetailSubtask(todoId, subId) {
            if (!state.selectedProject) return;
            const projId = state.selectedProject.id;
            const updatedProjects = state.projects.map(p => {
                if (p.id === projId) {
                    const todos = (p.todos || []).map(t => {
                        if (t.id === todoId) {
                            const subtasks = (t.subtasks || []).map(st => st.id === subId ? { ...st, completed: !st.completed } : st);
                            const allSubDone = subtasks.length > 0 && subtasks.every(s => s.completed);
                            return { ...t, subtasks, completed: allSubDone ? true : t.completed };
                        }
                        return t;
                    });
                    const newProgress = calculateOverallProgress(todos);
                    return { ...p, todos, progress: newProgress };
                }
                return p;
            });
            const updatedSelected = updatedProjects.find(p => p.id === projId);
            setState({ projects: updatedProjects, selectedProject: updatedSelected });
        }

        function addProjectDetailTodo(e) {
            e.preventDefault();
            if (!state.selectedProject) return;
            const input = document.getElementById('project-detail-new-todo');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();
            const projId = state.selectedProject.id;

            const newTodo = {
                id: 't_' + Date.now(),
                text: text,
                completed: false,
                subtasks: []
            };

            const updatedProjects = state.projects.map(p => {
                if (p.id === projId) {
                    const todos = [...(p.todos || []), newTodo];
                    const newProgress = calculateOverallProgress(todos);
                    return { ...p, todos, progress: newProgress };
                }
                return p;
            });
            input.value = '';
            const updatedSelected = updatedProjects.find(p => p.id === projId);
            setState({ projects: updatedProjects, selectedProject: updatedSelected });
        }

        function updateProjectDetailNotes(projId, val) {
            const updatedProjects = state.projects.map(p => {
                if (p.id === projId) {
                    return { ...p, notes: val };
                }
                return p;
            });
            const updatedSelected = updatedProjects.find(p => p.id === projId);
            setState({ projects: updatedProjects, selectedProject: updatedSelected });
        }

        
        function notifySuperAdminOnStatusChange(project, newStatus) {
            if (!state.currentUser) return;
            // Only trigger when an employee (not Super Admin) changes the status to Review or Completed
            if (state.currentUser.role === 'Super Admin') return;
            if (newStatus !== 'Review' && newStatus !== 'Completed') return;

            const employeeName = state.currentUser.name || 'Employee';
            const projectName = project.name || 'Project';

            const newNotification = {
                id: 'n_' + Date.now() + Math.random().toString(36).substr(2, 4),
                recipient: 'Super Admin',
                projectId: project.id,
                projectName: projectName,
                title: 'Project ' + newStatus + '!',
                message: employeeName + ' marked "' + projectName + '" as ' + newStatus + '.',
                timestamp: 'Just now',
                read: false
            };

            const currentNotifs = state.notifications || [];
            const updatedNotifs = [newNotification, ...currentNotifs];
            state.notifications = updatedNotifs;
            localStorage.setItem('sr_notifications', JSON.stringify(updatedNotifs));
        }

        function updateProjectDetailStatus(projId, val) {
            let targetProject = null;
            let prevStatus = '';
            const updatedProjects = state.projects.map(p => {
                if (p.id === projId) {
                    targetProject = p;
                    prevStatus = p.status;
                    return { ...p, status: val };
                }
                return p;
            });

            if (targetProject && prevStatus !== val) {
                notifySuperAdminOnStatusChange(targetProject, val);
            }

            const updatedSelected = updatedProjects.find(p => p.id === projId);
            setState({ projects: updatedProjects, selectedProject: updatedSelected });
        }

        function saveEmployeeEdits(e) {
            e.preventDefault();
            if (!state.currentUser || state.currentUser.role !== 'Super Admin' || !state.selectedEmployee) return;

            const formData = new FormData(e.target);
            const previousEmployee = state.selectedEmployee;
            const role = formData.get('role');
            const updatedEmployee = {
                ...previousEmployee,
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                role,
                dept: role === 'Super Admin' ? '' : formData.get('dept')
            };

            const employees = state.employees.map(emp => emp.id === updatedEmployee.id ? updatedEmployee : emp);
            const projects = previousEmployee.name === updatedEmployee.name
                ? state.projects
                : state.projects.map(project => project.assignedTo === previousEmployee.name ? { ...project, assignedTo: updatedEmployee.name } : project);
            const notifications = previousEmployee.name === updatedEmployee.name
                ? state.notifications
                : (state.notifications || []).map(notification => notification.recipient === previousEmployee.name ? { ...notification, recipient: updatedEmployee.name } : notification);
            const currentUser = state.currentUser.id === updatedEmployee.id ? updatedEmployee : state.currentUser;

            setState({
                employees,
                projects,
                notifications,
                currentUser,
                selectedEmployee: updatedEmployee,
                isEmployeeEditModalOpen: false
            });
        }

            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;
            const errBox = document.getElementById('password-error');

            if (currentPass !== state.currentUser.password) {
                errBox.innerText = 'Current password is incorrect!';
                errBox.classList.remove('hidden');

            if (newPass !== confirmPass) {
                errBox.innerText = 'New passwords do not match!';
                errBox.classList.remove('hidden');
                return;
            }

            state.employees = state.employees.map(emp => emp.id === state.currentUser.id ? { ...emp, password: newPass } : emp);
            state.currentUser.password = newPass;

            alert('Password successfully updated!');
            closePasswordModal();
            setState({});
        }

                dept: formData.get('dept'),
                assignedTo: formData.get('assignedTo'),
                priority: formData.get('priority'),
                startDate: formData.get('startDate'),
                estimateDate: formData.get('estimateDate')
            };

            state.projects = state.projects.map(p => p.id === projectId ? { ...p, ...updatedData } : p);
            setState({
                isClientModalOpen: false,
                activeClientData: null,
                isClientEditing: false
            });
        }

        // --- DOCUMENT / TO-DO, SUBTASKS, LIVE LINK & NOTES CONTROLLERS ---
        function openDocModal(id) {
            const proj = state.projects.find(p => p.id === id);
            if (proj) {
                setState({
                    isDocModalOpen: true,
                    activeDocData: {
                        projectId: proj.id,
                        projectName: proj.name,
                        dept: proj.dept,
                        status: proj.status,
                        liveLink: proj.liveLink || '',
                        notes: proj.notes || ''
                    },
                    tempTodos: proj.todos ? JSON.parse(JSON.stringify(proj.todos)) : []
                });
            }
        }
        function closeDocModal() { setState({ isDocModalOpen: false, activeDocData: null, tempTodos: [] }); }

        function addDocTodo() {
            const input = document.getElementById('doc-new-todo');
            const text = input.value.trim();
            if (!text) return;
            state.tempTodos.push({
                id: 'todo_' + Date.now() + Math.random().toString(36).substr(2, 4),
                text: text,
                completed: false,
                subtasks: []
            });
            input.value = '';
            render();
        }

        function toggleDocTodo(todoId) {
            state.tempTodos = state.tempTodos.map(t => {
                if (t.id === todoId) {
                    const nextCompleted = !t.completed;
                    const nextSubtasks = (t.subtasks || []).map(st => ({ ...st, completed: nextCompleted }));
                    return { ...t, completed: nextCompleted, subtasks: nextSubtasks };
                }
                return t;
            });
            render();
        }

        function deleteDocTodo(todoId) {
            state.tempTodos = state.tempTodos.filter(t => t.id !== todoId);
            render();
        }

        // Subtask Controllers
        
        function toggleSubtaskInput(todoId) {
            state.activeSubtaskInput = state.activeSubtaskInput === todoId ? null : todoId;
            render();
            if (state.activeSubtaskInput === todoId) {
                setTimeout(() => {
                    const el = document.getElementById(`subtask-input-${todoId}`);
                    if (el) el.focus();
                }, 50);
            }
        }

        function addSubtask(todoId) {
            const input = document.getElementById(`subtask-input-${todoId}`);
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            state.tempTodos = state.tempTodos.map(t => {
                if (t.id === todoId) {
                    const subtasks = t.subtasks || [];
                    return {
                        ...t,
                        subtasks: [
                            ...subtasks,
                            { id: 'st_' + Date.now() + Math.random().toString(36).substr(2, 4), text: text, completed: false }
                        ]
                    };
                }
                return t;
            });
            render();
        }

        function toggleSubtask(todoId, subId) {
            state.tempTodos = state.tempTodos.map(t => {
                if (t.id === todoId) {
                    const subtasks = (t.subtasks || []).map(st => st.id === subId ? { ...st, completed: !st.completed } : st);
                    return { ...t, subtasks };
                }
                return t;
            });
            render();
        }

        function deleteSubtask(todoId, subId) {
            state.tempTodos = state.tempTodos.map(t => {
                if (t.id === todoId) {
                    const subtasks = (t.subtasks || []).filter(st => st.id !== subId);
                    return { ...t, subtasks };
                }
                return t;
            });
            render();
        }

                function saveDocModalChanges(projectId) {
            const liveLinkVal = document.getElementById('doc-project-live-link').value.trim();
            const notesText = document.getElementById('doc-project-notes').value;
            const newStatus = document.getElementById('doc-project-status').value;
            const newProgress = calculateOverallProgress(state.tempTodos);

            let targetProject = null;
            let prevStatus = '';

            state.projects = state.projects.map(p => {
                if (p.id === projectId) {
                    targetProject = p;
                    prevStatus = p.status;
                    return {
                        ...p,
                        liveLink: liveLinkVal,
                        todos: state.tempTodos,
                        notes: notesText,
                        status: newStatus,
                        progress: newProgress
                    };
                }
                return p;
            });

            if (targetProject && prevStatus !== newStatus) {
                notifySuperAdminOnStatusChange(targetProject, newStatus);
            }

            if (state.selectedProject && state.selectedProject.id === projectId) {
                state.selectedProject = state.projects.find(p => p.id === projectId);
            }

            closeDocModal();
            setState({});
        }

        function openNewProjectModal() { setState({ isProjectModalOpen: true, tempTodos: [] }); }
        function closeProjectModal() { setState({ isProjectModalOpen: false, tempTodos: [] }); }

        function addTempTodo() {
            const input = document.getElementById('new-todo-input');
            const form = input ? input.closest('form') : null;
            const formValues = form ? Object.fromEntries(new FormData(form).entries()) : {};
            const text = input.value.trim();
            if (!text) return;
            state.tempTodos.push({
                id: 'todo_' + Date.now() + Math.random().toString(36).substr(2, 4),
                text: text,
                completed: false,
                subtasks: []
            });
            input.value = '';
            render();
            const refreshedForm = document.querySelector('#app form[onsubmit="saveProject(event)"]');
            if (refreshedForm) {
                Object.entries(formValues).forEach(([name, value]) => {
                    const field = refreshedForm.elements.namedItem(name);
                    if (field && 'value' in field) field.value = value;
                });
            }
        }

        function deleteTempTodo(todoId) {
            state.tempTodos = state.tempTodos.filter(t => t.id !== todoId);
            render();
        }

                function saveProject(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const calculatedProgress = calculateOverallProgress(state.tempTodos);
            const assignedTo = formData.get('assignedTo');
            const projectName = formData.get('name');
            const newProjectId = 'p_' + Date.now();

            const newP = {
                id: newProjectId,
                name: projectName,
                clientName: formData.get('clientName'),
                clientPhone: formData.get('clientPhone'),
                clientEmail: formData.get('clientEmail'),
                dept: formData.get('dept'),
                startDate: formData.get('startDate'),
                estimateDate: formData.get('estimateDate'),
                priority: formData.get('priority'),
                status: formData.get('status'),
                assignedTo: assignedTo,
                liveLink: formData.get('liveLink') || '',
                todos: state.tempTodos,
                progress: calculatedProgress,
                notes: formData.get('notes')
            };

            // Create notification for assigned employee
            const newNotification = {
                id: 'n_' + Date.now(),
                recipient: assignedTo,
                projectId: newProjectId,
                projectName: projectName,
                title: 'New Project Assigned!',
                message: `Super Admin assigned "${projectName}" to you.`,
                timestamp: 'Just now',
                read: false
            };

            const updatedNotifs = [newNotification, ...(state.notifications || [])];
            state.projects = [newP, ...state.projects];
            state.notifications = updatedNotifs;
            localStorage.setItem('sr_notifications', JSON.stringify(updatedNotifs));

            closeProjectModal();
            setState({});
        }

        function deleteProject(id, name) {
            if (confirm(`Are you sure you want to delete "${name}"?`)) {
                state.projects = state.projects.filter(p => p.id !== id);
                setState({});
            }
        }

        function exportCSV() {
            const headers = ['Project Name,Client Name,Client Phone,Client Email,Department,Start Date,Estimate Date,Priority,Status,Assigned To,Live Link,Progress\n'];
            const rows = state.projects.map(p => `"${p.name}","${p.clientName}","${p.clientPhone}","${p.clientEmail}","${p.dept}","${formatDate(p.startDate)}","${formatDate(p.estimateDate)}","${p.priority}","${p.status}","${p.assignedTo}","${p.liveLink || ''}",${p.progress}%`);
            const blob = new Blob([...headers, ...rows], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `StoreRepublic_Projects_${formatDate(new Date().toISOString().slice(0,10)).replaceAll(' - ', '-')}.csv`;
            a.click();
        }

        // Initial Render
        render();
    </script>
</body>
</html>
